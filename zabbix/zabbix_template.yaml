            key: '1c.healthcheck.report'
          preprocessing:
            - type: JSONPATH
              params: '$.licenses'
              error_handler: DISCARD_VALUE
              error_handler_params: ''
          uuid: '444a318593be4d6db0c406943f039373'
      triggers:
        - name: '{HOST.NAME}: 1C Healthcheck FAILED'
          expression: '{Template 1C Web Client Healthcheck:1c.healthcheck.status.last()}=0'
          severity: AVERAGE
          description: '1C Web Client healthcheck returned failure status'
          uuid: '2d0492ce180b470cac4c241736d2bcac'
        - name: '{HOST.NAME}: Healthcheck slow (>30s)'
          expression: '{Template 1C Web Client Healthcheck:1c.healthcheck.total_ms.last()}>30000'
          severity: WARNING
          description: 'Healthcheck took more than 30 seconds'
          uuid: '016c04c06c18453b9ea708289b1fce2e'
        - name: '{HOST.NAME}: Platform version changed'
          expression: '{Template 1C Web Client Healthcheck:1c.healthcheck.version.nodata(1h)}=1&{Template 1C Web Client Healthcheck:1c.healthcheck.version.diff()}<>0'
          severity: INFO
          manual_close: 'YES'
          description: '1C platform version has changed or no data for 1 hour'
          uuid: '1600f5e36c9045b29a8518f2af48174e'
        - name: '{HOST.NAME}: Healthcheck error occurred'
          expression: '{Template 1C Web Client Healthcheck:1c.healthcheck.error.nodata(1h)}=1&{Template 1C Web Client Healthcheck:1c.healthcheck.status.last()}=0'
          severity: HIGH
          manual_close: 'YES'
          description: 'Healthcheck error occurred or no data for 1 hour'
          uuid: 'dad53aae5a894f05baad00b59ad48fba'
