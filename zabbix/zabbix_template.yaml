zabbix_export:
  version: '7.0'
  date: '2026-07-24T00:00:00Z'
  groups:
    - group:
        name: Templates
    - group:
        name: '1C Healthchecks'
  templates:
    - template: 'Template 1C Web Client Healthcheck'
      name: 'Template 1C Web Client Healthcheck'
      description: 'Healthcheck template for 1C Web Client. Receives full JSON report and extracts fields via JSONPath.'
      groups:
        - group:
            name: Templates
        - group:
            name: '1C Healthchecks'
      items:
        - name: 'Full JSON Report'
          type: TRAPPER
          key: '1c.healthcheck.report'
          description: 'Full JSON report from healthcheck. Dependent items extract fields via JSONPath preprocessing.'
          value_type: TEXT
          history: 7d
          uuid: '9d4d41c4b13448138907642286f46016'
        - name: 'Healthcheck Status'
          type: DEPENDENT
          key: '1c.healthcheck.status'
          description: '1 = success, 0 = failure. Extracted via JSONPath.'
          value_type: INTEGER
          data_type: INTEGER
          history: 30d
          master_item:
            key: '1c.healthcheck.report'
          preprocessing:
            - type: JSONPATH
              params: '$.status'
              error_handler: DISCARD_VALUE
              error_handler_params: ''
          uuid: 'c0af22c3841e410db805f660a9c98736'
        - name: 'Error'
          type: DEPENDENT
          key: '1c.healthcheck.error'
          description: 'Error message. Extracted via JSONPath.'
          value_type: TEXT
          history: 30d
          master_item:
            key: '1c.healthcheck.report'
          preprocessing:
            - type: JSONPATH
              params: '$.error'
              error_handler: DISCARD_VALUE
              error_handler_params: ''
          uuid: '8e678c86ad174b95870591b016aca481'
        - name: 'Platform Version'
          type: DEPENDENT
          key: '1c.healthcheck.version'
          description: '1C:Enterprise platform version. Extracted via JSONPath.'
          value_type: TEXT
          history: 90d
          master_item:
            key: '1c.healthcheck.report'
          preprocessing:
            - type: JSONPATH
              params: '$.platformVersion'
              error_handler: DISCARD_VALUE
              error_handler_params: ''
          uuid: '0fde06bd1883420a92336c4ed8bac09b'
        - name: 'Total Execution Time'
          type: DEPENDENT
          key: '1c.healthcheck.total_ms'
          description: 'Total execution time in ms. Extracted via JSONPath.'
          value_type: FLOAT
          units: ms
          history: 30d
          master_item:
            key: '1c.healthcheck.report'
          preprocessing:
            - type: JSONPATH
              params: '$.timings.total_ms'
              error_handler: DISCARD_VALUE
              error_handler_params: ''
          uuid: '25fbfd24b7164a39a618a74ec0ca71c1'
        - name: 'Login Page Load Time'
          type: DEPENDENT
          key: '1c.healthcheck.login_page_ms'
          description: 'Login page load time in ms. Extracted via JSONPath.'
          value_type: FLOAT
