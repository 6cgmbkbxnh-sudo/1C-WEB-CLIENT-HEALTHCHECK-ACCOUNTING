      name: '1C Healthchecks'
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: c0af22c3841e414db805f660a9c98736
      template: 'Template 1C Web Client Healthcheck'
      name: 'Template 1C Web Client Healthcheck'
      description: 'Healthcheck template for 1C Web Client. Receives full JSON report and extracts fields via JSONPath.'
      groups:
        - name: '1C Healthchecks'
        - name: Templates
      items:
        - uuid: 3b767ddaef244bfdb4c4d0e389f3a509
          name: 'About Dialog Open Time'
          type: DEPENDENT
          key: 1c.healthcheck.about_open_ms
          history: 30d
          value_type: FLOAT
          units: s
          description: 'About dialog open time in ms. Extracted via JSONPath.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.timings.about_open_ms
          master_item:
            key: 1c.healthcheck.report
        - uuid: 8e678c86ad174b95870591b016aca481
